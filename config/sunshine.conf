origin_pin_allowed = lan,wan,pc
min_log_level = info
encoder = nvenc
capture = x11
audio_sink = GameAudio
address = 0.0.0.0
port = 47989
# Admin UI accepts localhost only. Pairing from Moonlight still uses origin_pin_allowed.
origin_web_ui_allowed = pc
channels = 2
flags = 0
global_prep_cmd = []

# ── Codec support ──────────────────────────────────────────────
# Enable HEVC (H.265) for much sharper image at same bitrate vs H.264
# 0 = off, 1 = HEVC Main, 2 = HEVC Main10 (HDR capable)
hevc_mode = 2

# Enable AV1 (best quality codec, needs modern client hardware)
# 0 = off, 1 = AV1 8-bit, 2 = AV1 10-bit
av1_mode = 2

# ── NVENC encoder quality tuning ───────────────────────────────
# Preset P7 = highest quality (the L40S has plenty of NVENC headroom)
nvenc_preset = 7

# Two-pass encoding: full_res = best quality
nvenc_twopass = full_res

# H.264 CAVLC entropy coding: disabled (CABAC is higher quality)
nvenc_h264_cavlc = disabled

# Rate control: cbr = constant bitrate (most stable quality)
nvenc_rate_control = cbr

# Let the driver decide split encoding (best for L40S dual-encoder chip)
nvenc_split_encode = driver_decides

# Spatial Adaptive Quantization: sharpens fine textures and foliage
nvenc_spatial_aq = enabled

# Temporal Adaptive Quantization: maintains detail and sharpness across motion
nvenc_temporal_aq = enabled

# ── Network / Error correction ─────────────────────────────────
# FEC (Forward Error Correction) percentage: 20% for stable WAN/VPN
fec_percentage = 20

# Safe MTU packet size for a VPN path (avoids UDP fragmentation)
packet_size = 1024

# ── Quality of life ───────────────────────────────────────────
# Disable upnp (using Tailscale, not needed)
upnp = disabled
