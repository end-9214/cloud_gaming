Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "DummyScreen" 0 0
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "AllowEmptyInput" "true"
    Option "DontZap" "false"
EndSection

Section "InputClass"
    Identifier "libinput pointer catchall"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "AccelProfile" "flat"
    Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
    Identifier "libinput keyboard catchall"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "libinput touchscreen catchall"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "libinput tablet catchall"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

Section "Device"
    Identifier "DummyDevice"
    Driver "dummy"
    VideoRam 512000
EndSection

Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 28.0-200.0
    VertRefresh 48.0-200.0
    DisplaySize 508 285
    # 4K 60Hz
    Modeline "3840x2160_60.00"  712.75  3840 4152 4576 5312  2160 2163 2168 2237 -hsync +vsync
    # 1080p 60Hz
    Modeline "1920x1080_60.00"  173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
    # 1080p 165Hz
    Modeline "1920x1080_165.00"  525.00  1920 2088 2296 2672  1080 1083 1088 1192 -hsync +vsync
    # 1080p 120Hz
    Modeline "1920x1080_120.00" 370.00  1920 2064 2272 2624  1080 1083 1088 1175 -hsync +vsync
    # 1440p 60Hz
    Modeline "2560x1440_60.00"  241.50  2560 2720 2992 3424  1440 1443 1448 1473 -hsync +vsync
    # 720p 60Hz
    Modeline "1280x720_60.00"    74.50  1280 1344 1472 1664   720  723  728  748 -hsync +vsync
EndSection

Section "Screen"
    Identifier "DummyScreen"
    Device "DummyDevice"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_165.00" "1920x1080_120.00" "1920x1080" "1920x1080_60.00" "1280x720"
    EndSubSection
EndSection
